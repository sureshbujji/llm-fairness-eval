name: fairness-gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: |
          python -m pytest tests/ -q
      - name: Fairness gate (mock backend)
        run: |
          # Mock backend is scripted with a hiring bias, so the gate MUST
          # fail here — that proves the gate mechanics catch real bias.
          # A passing gate would mean the metrics went blind.
          if python src/evaluator.py --mock --fail-on-critical; then
            echo "ERROR: gate passed on deliberately biased mock data"
            exit 1
          fi
          echo "Gate correctly failed on biased mock data (expected)"
